name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test ./...

  build:
    name: Build for ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: git-navigator-linux-x64
          - os: macos-latest
            artifact: git-navigator-darwin-x64
          - os: windows-latest
            artifact: git-navigator-windows-x64.exe
          - os: ubuntu-latest
            artifact: git-navigator-linux-arm64
            goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos || '' }}
          GOARCH: ${{ matrix.goarch || '' }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION=${VERSION#v}
          CGO_ENABLED=0 go build -ldflags="-s -w -X github.com/blitux/git-navigator/internal/core.Version=$VERSION" -o ${{ matrix.artifact }} ./cmd/git-navigator

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
